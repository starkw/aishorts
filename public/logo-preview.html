<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Logo 方案预览</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f5f5f7; display: flex; flex-direction: column; align-items: center; padding: 40px; }
    h1 { color: #1d1d1f; margin-bottom: 40px; }
    .grid { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
    .card { background: white; border-radius: 16px; padding: 32px 40px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); text-align: center; min-width: 200px; }
    .card h3 { color: #6366f1; margin: 0 0 24px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo-row span { font-weight: 700; font-size: 18px; background: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sizes { display: flex; gap: 16px; align-items: center; justify-content: center; margin-top: 16px; }
    .label { font-size: 11px; color: #999; margin-top: 6px; }
    .current { background: #f0f0f0; border-radius: 8px; padding: 8px 12px; }
    .current span { color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🎨 AI Shorts Logo 方案对比</h1>
  <div class="grid">

    <!-- 当前方案 -->
    <div class="card">
      <h3>当前方案</h3>
      <div class="logo-row" style="justify-content:center">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="7" fill="url(#curr)"/>
          <path d="M14 6l1.5 5.5L21 13l-5.5 1.5L14 20l-1.5-5.5L7 13l5.5-1.5Z" fill="white"/>
          <defs><linearGradient id="curr" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
        </svg>
        <span>AI Shorts</span>
      </div>
      <div class="current"><span>现在线上版本</span></div>
    </div>

    <!-- 方案 1 -->
    <div class="card">
      <h3>方案 1 · 对话闪电</h3>
      <div class="logo-row" style="justify-content:center">
        <img src="/logo-v1.svg" width="36" height="36">
        <span>AI Shorts</span>
      </div>
      <div class="sizes">
        <div><img src="/logo-v1.svg" width="48" height="48"><div class="label">48px</div></div>
        <div><img src="/logo-v1.svg" width="32" height="32"><div class="label">32px</div></div>
        <div><img src="/logo-v1.svg" width="20" height="20"><div class="label">20px</div></div>
      </div>
      <p style="color:#666;font-size:13px;margin-top:16px">气泡代表对话，闪电代表高效<br>寓意：AI快速回答你的问题</p>
    </div>

    <!-- 方案 2 -->
    <div class="card">
      <h3>方案 2 · AI字母</h3>
      <div class="logo-row" style="justify-content:center">
        <img src="/logo-v2.svg" width="36" height="36">
        <span>AI Shorts</span>
      </div>
      <div class="sizes">
        <div><img src="/logo-v2.svg" width="48" height="48"><div class="label">48px</div></div>
        <div><img src="/logo-v2.svg" width="32" height="32"><div class="label">32px</div></div>
        <div><img src="/logo-v2.svg" width="20" height="20"><div class="label">20px</div></div>
      </div>
      <p style="color:#666;font-size:13px;margin-top:16px">直接用 AI 字母，清晰直观<br>右上角星星代表智能/精选</p>
    </div>

    <!-- 方案 3 -->
    <div class="card">
      <h3>方案 3 · 四角星</h3>
      <div class="logo-row" style="justify-content:center">
        <img src="/logo-v3.svg" width="36" height="36">
        <span>AI Shorts</span>
      </div>
      <div class="sizes">
        <div><img src="/logo-v3.svg" width="48" height="48"><div class="label">48px</div></div>
        <div><img src="/logo-v3.svg" width="32" height="32"><div class="label">32px</div></div>
        <div><img src="/logo-v3.svg" width="20" height="20"><div class="label">20px</div></div>
      </div>
      <p style="color:#666;font-size:13px;margin-top:16px">大星+小星组合，精致感强<br>代表精选、闪光的AI提示词</p>
    </div>

  </div>

  <p style="margin-top:48px;color:#999;font-size:13px">告诉我选哪个方案，或者你有其他想法，我来调整 ✨</p>
</body>
</html>
